[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-resolution-ml"
version = "0.1.0"
description = "A scalable two-stage business entity-resolution pipeline"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "rapidfuzz==3.14.6",
  "sparse-dot-topn==1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

